site_name: UiPath 智能体测试与编码智能体
site_url: https://vincentzhenguipath.github.io/AgenticTestingWorkshop_SC/
site_description: 动手实践学员手册：借助编码智能体规划、自动化、执行 UiPath 测试并生成报告（简体中文版）
site_author: Sergey Shumilov

# hello-world-agent/ is a retired folder the sandbox mount couldn't delete.
# Excluded from the build — remove the folder locally when convenient.
exclude_docs: |
  hello-world-agent/
  # Loan Application Underwriting and recruitment pipeline pages — retired when
  # the course moved to Agentic Testing. Kept in the repo for reference.
  loan-application-underwriting/

theme:
  name: material
  language: zh
  logo: assets/images/Partner Success Logo.png
  favicon: assets/images/favicon.png
  font:
    text: Inter
  palette:
    scheme: default
    primary: deep orange
    accent: orange
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.integrate
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tabs.link

hooks:
  - hooks/split_cols.py
  - hooks/toc_no_emoji.py

# main.py provides environment variables (training_url, training_tenant, env_label)
# driven by the COURSE_ENV env var (staging | prod). See main.py.
plugins:
  - search:
      lang:
        - zh
        - en
      separator: '[\s​\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - macros:
      module_name: main

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# Published navigation only. Work-in-progress pages live in mkdocs.local.yml.
nav:
  - 首页: index.md
  - 环境准备: setup.md
  - 议程: agenda.md
  - 智能体测试与编码智能体: what-is-a-coding-agent.md
  - 测试准备: agentic-testing-hands-on.md
  - 需求: requirements.md
  - 测试用例: test-cases.md
  - 执行: executions.md
  - 测试集: test-sets.md
  - SAP 测试: sap-testing.md
  - 资源: resources.md
  - 后续步骤: next-steps.md

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js

extra:
  generator: false
